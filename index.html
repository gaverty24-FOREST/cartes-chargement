<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Cartes de Chargement</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h2 { margin-top: 0; color: #2980b9; font-size: 1.2em; }
        .card p { margin: 8px 0; font-size: 0.95em; }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚛 Mes Cartes de Chargement</h1>

        <!-- CLIENT 1 -->
        <div class="card">
            <h2>MERRANDERIE OLIVEIRA</h2>
            <p><strong>Lieu :</strong> Chassaignes (24600)</p>
            <p><strong>Produit :</strong> Bois chauffage chêne calibré</p>
            <p><strong>Contact :</strong> 06.87.49.07.32</p>
            <a href="./merranderie/" class="btn"> Voir la carte</a>
        </div>

        <!-- Pour ajouter un futur client, copiez le bloc <div class="card"> ci-dessus et collez-le ici -->

    </div>
</body>
</html>
